<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사업안내 · 북원노인종합복지관</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  :root{--brand:#F38100;--action:#8A4200;--ink:#2B2320;--gray:#6B655F;--line:#EAE2D6;--cream:#FAF7F2;--soft:#FDF0E2;--white:#fff;--accent:#2E8B77;--accent-soft:#E4F1EC;--shadow:0 6px 20px rgba(120,90,50,.08);--r:18px;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:#fff;}
  body{font-family:'Pretendard','Apple SD Gothic Neo','맑은 고딕',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:900px;margin:0;padding:0 16px 28px;}

  .head{padding:20px 4px 4px;}
  .bc{font-size:13.5px;color:var(--gray);font-weight:600;margin-bottom:9px;}
  .bc b{color:var(--brand);}
  .head h1{font-size:28px;font-weight:800;letter-spacing:-.8px;}
  .head .sub{display:inline-block;margin-top:8px;font-size:14px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:20px;}
  .head p{font-size:16px;color:#5c554e;line-height:1.6;margin-top:11px;word-break:keep-all;}

  .tabs{display:flex;gap:8px;margin:18px 0 20px;flex-wrap:wrap;}
  .tab{flex:1;min-width:90px;text-align:center;border:1.5px solid var(--line);background:var(--white);color:var(--gray);font-size:15.5px;font-weight:800;padding:12px 6px;border-radius:14px;cursor:pointer;}
  .tab.on{background:var(--brand);border-color:var(--brand);color:#fff;}

  .sec{font-size:20px;font-weight:800;margin:24px 2px 13px;display:flex;align-items:center;gap:9px;letter-spacing:-.4px;}
  .sec::before{content:"";width:6px;height:21px;border-radius:3px;background:var(--accent);}

  .info{display:flex;flex-direction:column;gap:11px;}
  .icard{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 17px;}
  .ic{flex:none;width:50px;height:50px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;}
  .ic svg{width:26px;height:26px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ic.tl{background:var(--accent-soft);}
  .ic.tl svg{stroke:var(--accent);}
  .itx{flex:1;min-width:0;}
  .itx .l{font-size:13.5px;color:var(--gray);font-weight:700;margin-bottom:3px;}
  .itx .v{font-size:17px;font-weight:800;letter-spacing:-.2px;line-height:1.4;word-break:keep-all;}
  .itx .v a{color:var(--action);}

  .steps{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px 18px;}
  .stp{display:flex;gap:15px;padding:17px 0;border-bottom:1px solid var(--line);}
  .stp:last-child{border-bottom:none;}
  .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .stp b{font-size:17px;font-weight:800;}
  .stp p{font-size:15px;color:var(--gray);margin-top:4px;line-height:1.55;word-break:keep-all;}

  .note{background:var(--soft);border:1px solid #F3D6B0;border-radius:16px;padding:14px 17px;display:flex;gap:11px;margin-top:14px;align-items:center;}
  .note svg{flex:none;width:22px;height:22px;stroke:var(--brand);fill:none;stroke-width:2.2;}
  .note b{font-size:15.5px;font-weight:700;line-height:1.5;word-break:keep-all;}

  .list{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:8px 19px;}
  .grp{padding:14px 0;border-bottom:1px solid var(--line);}
  .grp:last-child{border-bottom:none;}
  .grp .t{font-size:17px;font-weight:800;margin-bottom:7px;display:flex;align-items:center;gap:8px;}
  .grp .t::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand);}
  .li{display:flex;gap:10px;padding:4px 0 4px 16px;font-size:15.5px;line-height:1.55;color:#40382f;word-break:keep-all;}
  .li svg{flex:none;width:19px;height:19px;stroke:var(--accent);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;margin-top:2px;}

  .call{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--brand);color:#fff;font-size:21px;font-weight:800;height:60px;border-radius:16px;box-shadow:0 8px 22px rgba(243,129,0,.26);margin-top:24px;}
  .call svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;}

  /* 사진 갤러리 */
  .gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .ph{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;}
  .ph .frame{width:100%;aspect-ratio:4/3;background:var(--soft);display:flex;align-items:center;justify-content:center;}
  .ph .frame img{max-width:100%;max-height:100%;object-fit:contain;display:block;}
  .ph .cap{font-size:13.5px;font-weight:700;color:#4a4038;padding:9px 12px;line-height:1.4;word-break:keep-all;}
  @media (min-width:480px){.gallery{grid-template-columns:repeat(3,1fr);gap:15px;}.ph .cap{font-size:15px;}}
  /* 라이트박스 */
  .lb{position:fixed;inset:0;background:rgba(20,14,8,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:99;}
  .lb img{max-width:94%;max-height:80%;object-fit:contain;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
  .lb .cap{color:#fff;font-size:16px;font-weight:700;margin-top:16px;text-align:center;word-break:keep-all;}
  .lb .x{position:absolute;top:16px;right:20px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
  var ICONS={
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    phone:'<path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012 4.2 2 2 0 014 2h3a2 2 0 012 1.7c.1.9.3 1.8.6 2.6a2 2 0 01-.5 2.1L8 9.6a16 16 0 006 6l1.2-1.1a2 2 0 012.1-.5c.8.3 1.7.5 2.6.6A2 2 0 0122 16.9z"/>',
    edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
    route:'<circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M9 19h6a3 3 0 003-3V8"/>',
    pin:'<path d="M12 21s-6-5.3-6-10a6 6 0 0112 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/>'
  };
  var CHECK='<path d="M20 6L9 17l-5-5"/>';
  var IMG_BASE='data/saeop/img/';   // 사진 파일 폴더
  var DATA=null, group=null, gobj=null, cur=0;

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function svg(p){return '<svg viewBox="0 0 24 24">'+p+'</svg>';}
  function param(k){var m=new RegExp('[?&]'+k+'=([^&]+)').exec(location.search);return m?decodeURIComponent(m[1]):null;}

  function render(){
    var t=gobj.탭[cur];
    var tel=(t.정보||[]).filter(function(x){return x.tel;})[0];
    var telNo=tel?tel.tel:(DATA.문의전화||'033-747-0516');
    var h='';

    // 상단
    h+='<div class="head"><div class="bc">사업안내 <b>›</b> '+esc(gobj.대분류)+' <b>›</b> '+esc(t.제목)+'</div>';
    h+='<h1>'+esc(t.제목)+'</h1>';
    if(t.부제) h+='<div class="sub">'+esc(t.부제)+'</div>';
    if(t.설명) h+='<p>'+esc(t.설명)+'</p>';
    h+='</div>';

    // 탭 (2개 이상일 때만)
    if(gobj.탭.length>1){
      h+='<div class="tabs">'+gobj.탭.map(function(x,i){
        return '<div class="tab'+(i===cur?' on':'')+'" data-i="'+i+'">'+esc(x.제목)+'</div>';
      }).join('')+'</div>';
    }

    // 한눈에 보기
    if(t.정보&&t.정보.length){
      h+='<div class="sec">한눈에 보기</div><div class="info">';
      t.정보.forEach(function(it){
        var tl=it.tel?' tl':'';
        var v=it.tel?'<a href="tel:'+esc(it.tel).replace(/[^0-9]/g,'')+'">'+esc(it.값)+'</a>':esc(it.값);
        h+='<div class="icard"><div class="ic'+tl+'">'+svg(ICONS[it.icon]||ICONS.user)+'</div>'
          +'<div class="itx"><div class="l">'+esc(it.라벨)+'</div><div class="v">'+v+'</div></div></div>';
      });
      h+='</div>';
    }

    // 절차 (STEP)
    if(t.절차&&t.절차.length){
      h+='<div class="sec">'+esc(t.절차제목||'이용 절차')+'</div><div class="steps">';
      t.절차.forEach(function(s,i){
        h+='<div class="stp"><div class="num">'+(i+1)+'</div><div><b>'+esc(s.제목)+'</b>'
          +(s.설명?'<p>'+esc(s.설명)+'</p>':'')+'</div></div>';
      });
      h+='</div>';
    }

    // 안내 (주황 강조 박스) — 절차가 없어도 표시
    if(t.안내) h+='<div class="note"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg><b>'+esc(t.안내)+'</b></div>';

    // 내용
    if(t.내용&&t.내용.length){
      h+='<div class="sec">'+esc(t.내용제목||'주요 내용')+'</div><div class="list">';
      t.내용.forEach(function(g){
        h+='<div class="grp"><div class="t">'+esc(g.소제목)+'</div>';
        (g.항목||[]).forEach(function(li){ h+='<div class="li">'+svg(CHECK)+'<div>'+esc(li)+'</div></div>'; });
        h+='</div>';
      });
      h+='</div>';
    }

    // 사진 (하단 갤러리)
    if(t.사진&&t.사진.length){
      h+='<div class="sec">현장 사진</div><div class="gallery">';
      t.사진.forEach(function(p,i){
        var src=IMG_BASE+encodeURIComponent(p.파일);
        h+='<div class="ph" data-ph="'+i+'"><div class="frame"><img src="'+src+'" alt="'+esc(p.캡션||'')+'"></div>'
          +(p.캡션?'<div class="cap">'+esc(p.캡션)+'</div>':'')+'</div>';
      });
      h+='</div>';
    }

    // 문의 버튼
    h+='<a class="call" href="tel:'+esc(telNo).replace(/[^0-9]/g,'')+'">'+svg(ICONS.phone)+'전화로 문의하기</a>';

    document.getElementById('app').innerHTML=h;
    document.querySelectorAll('.tab').forEach(function(b){
      b.addEventListener('click',function(){ cur=+b.dataset.i; render(); window.scrollTo(0,0); });
    });
    // 사진 클릭 → 라이트박스
    var photos=t.사진||[];
    document.querySelectorAll('.ph').forEach(function(el){
      el.addEventListener('click',function(){ openLightbox(photos[+el.dataset.ph]); });
    });
    sendHeight();
  }

  function openLightbox(p){
    if(!p) return;
    var d=document.createElement('div'); d.className='lb';
    d.innerHTML='<div class="x">×</div><img src="'+IMG_BASE+encodeURIComponent(p.파일)+'">'+(p.캡션?'<div class="cap">'+esc(p.캡션)+'</div>':'');
    d.addEventListener('click',function(){ d.remove(); });
    document.body.appendChild(d);
  }

  group = param('group') || 'sangdam';   // 페이지(부서) 코드 = data/saeop/<코드>.json
  fetch('data/saeop/'+encodeURIComponent(group)+'.json?t='+Date.now()).then(function(r){return r.json();}).then(function(j){
    DATA=j; gobj=j;   // j = { 대분류, 탭, 문의전화, ... }
    if(!gobj || !gobj.탭){ document.getElementById('app').innerHTML='<div style="padding:40px;text-align:center;color:#888">페이지를 찾을 수 없습니다.</div>'; return; }
    var tp=param('tab'); if(tp){ gobj.탭.forEach(function(x,i){ if(x.이름표===tp) cur=i; }); }
    render();
  }).catch(function(){ document.getElementById('app').innerHTML='<div style="padding:40px;text-align:center;color:#888">내용을 불러오지 못했습니다.</div>'; });

  function sendHeight(){ try{var h=Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height)+12; parent.postMessage({bwSaeop:'height',height:h},'*'); }catch(e){} }
  window.addEventListener('load',sendHeight); window.addEventListener('resize',sendHeight);
  setTimeout(sendHeight,700); setTimeout(sendHeight,1600);
})();
</script>
</body>
</html>
