<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연혁 · 북원노인종합복지관</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  :root{--brand:#F38100;--action:#8A4200;--ink:#2B2320;--gray:#6B655F;--line:#EAE2D6;--soft:#FDF0E2;--white:#fff;--accent:#2E8B77;--shadow:0 6px 20px rgba(120,90,50,.08);--r:16px;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:#fff;}
  body{font-family:'Pretendard','Apple SD Gothic Neo','맑은 고딕',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1200px;margin:0;padding:6px 16px 30px;}

  /* 탭 */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 22px;}
  .tab{border:1.5px solid var(--line);background:var(--white);color:var(--gray);font-size:clamp(17px,calc(15.78px + 0.31vw),19.2px);font-weight:800;padding:11px 18px;border-radius:13px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow);}
  .tab.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(243,129,0,.24);}

  /* 타임라인 */
  .tl{position:relative;padding-left:20px;}
  .tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:3px;background:var(--line);border-radius:2px;}
  .yr{display:flex;align-items:center;gap:12px;margin:26px 0 12px;}
  .yr:first-child{margin-top:4px;}
  .yr .n{font-size:clamp(31.8px,calc(29.58px + 0.582vw),36px);font-weight:800;letter-spacing:-1px;color:var(--ink);}
  .ev{position:relative;display:flex;gap:16px;padding:9px 0;}
  .ev::before{content:"";position:absolute;left:-19px;top:15px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--brand);box-sizing:border-box;}
  .ev .d{flex:none;width:66px;font-size:clamp(16.4px,calc(15.28px + 0.301vw),18.6px);font-weight:800;color:var(--action);padding-top:1px;letter-spacing:-.3px;}
  .ev .c{flex:1;font-size:clamp(17px,calc(15.78px + 0.31vw),19.2px);font-weight:600;line-height:1.55;color:#3c342d;word-break:keep-all;padding-top:1px;}
  .hidden{display:none!important;}
  .none{color:var(--gray);font-size:clamp(17px,calc(15.78px + 0.31vw),19.2px);padding:30px 0;}
  @media (min-width:480px){
    .tab{font-size:clamp(18px,calc(16.76px + 0.33vw),20.4px);}
    .yr .n{font-size:clamp(36px,calc(33.52px + 0.66vw),40.8px);}
    .ev .d{width:74px;font-size:clamp(17px,calc(15.78px + 0.31vw),19.2px);}
    .ev .c{font-size:clamp(18px,calc(16.76px + 0.33vw),20.4px);}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs seg" id="tabs"></div>
  <div id="tl"></div>
</div>
<script>
(function(){
  // 편집기 규약: 연도그룹마다 .tabpanel#tp{i}, 탭 버튼 = .seg button[data-v], 불러오기 = BW_LOAD 마커
  var cur=null;
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function param(k){var m=new RegExp('[?&]'+k+'=([^&]+)').exec(location.search);return m?decodeURIComponent(m[1]):null;}

  function render(j){
    var G=(j&&j.그룹)||[], tl=document.getElementById('tl');
    if(!G.length){ document.getElementById('tabs').innerHTML=''; tl.innerHTML='<div class="none">연혁을 불러오지 못했습니다.</div>'; sendHeight(); return; }
    if(cur==null){ cur=0; var tp=param('tab'); if(tp){ G.forEach(function(g,i){ if(g.이름===tp) cur=i; }); } }
    if(cur>=G.length) cur=0;
    document.getElementById('tabs').innerHTML=G.map(function(g,i){
      return '<button class="tab'+(i===cur?' on':'')+'" data-v="'+i+'">'+esc(g.이름)+'</button>';
    }).join('');
    tl.innerHTML=G.map(function(g,i){
      var items=g.항목||[], h='', lastYear=null;
      if(!items.length) h='<div class="none">등록된 연혁이 없습니다.</div>';
      items.forEach(function(it){
        if(it.연도 && it.연도!==lastYear){ h+='<div class="yr"><span class="n">'+esc(it.연도)+'</span></div>'; lastYear=it.연도; }
        h+='<div class="ev"><div class="d">'+esc(it.날짜||'')+'</div><div class="c">'+esc(it.내용)+'</div></div>';
      });
      return '<div class="tabpanel tl'+(i===cur?'':' hidden')+'" id="tp'+i+'">'+h+'</div>';
    }).join('');
    sendHeight();
  }
  document.getElementById('tabs').addEventListener('click',function(e){
    var b=e.target.closest('.tab'); if(!b) return;
    cur=+b.dataset.v;
    document.querySelectorAll('#tabs .tab').forEach(function(x,j){ x.classList.toggle('on',j===cur); });
    document.querySelectorAll('#tl .tabpanel').forEach(function(p,j){ p.classList.toggle('hidden',j!==cur); });
    window.scrollTo(0,0); sendHeight();
  });

  /*BW_LOAD*/fetch('data/history.json?t='+Date.now()).then(function(r){return r.json();}).then(render)
    .catch(function(){ document.getElementById('tl').innerHTML='<div class="none">연혁을 불러오지 못했습니다.</div>'; });/*BW_LOAD_END*/

  function sendHeight(){ try{var h=Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height)+12; parent.postMessage({bwHistory:'height',height:h},'*'); }catch(e){} }
  window.addEventListener('load',sendHeight); window.addEventListener('resize',sendHeight);
  setTimeout(sendHeight,600); setTimeout(sendHeight,1500);
})();
</script>
</body>
</html>
