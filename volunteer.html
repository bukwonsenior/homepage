<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자원봉사 · 북원노인종합복지관</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
:root{--brand:#F38100;--action:#8A4200;--ink:#2B2320;--gray:#6B655F;--line:#EAE2D6;--soft:#FDF0E2;--white:#fff;--accent:#2E8B77;--accent-soft:#E4F1EC;--shadow:0 6px 20px rgba(120,90,50,.08);--r:18px;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:#fff;}
body{font-family:'Pretendard','Apple SD Gothic Neo','맑은 고딕',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.wrap{max-width:1465px;margin:0;padding:6px 16px 30px;}
a{color:inherit;text-decoration:none;}
.hero{padding:4px 2px 2px;margin:0 0 6px;}
.hero .bc{font-size:clamp(13px,3.4vw,14px);color:var(--gray);font-weight:700;margin-bottom:8px;}
.hero .bc b{color:var(--brand);}
.hero h1{font-size:clamp(27px,6vw,38px);font-weight:800;letter-spacing:-1px;}
.hero p{font-size:clamp(15.5px,4vw,18px);color:#5a5149;line-height:1.65;margin-top:12px;word-break:keep-all;max-width:760px;}
.applybtns{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;}
.applybtns a{display:flex;align-items:center;gap:11px;background:var(--white);border:1.5px solid var(--line);border-radius:15px;padding:14px 20px;box-shadow:var(--shadow);}
.applybtns .ic{width:42px;height:42px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;}
.applybtns .ic svg{width:22px;height:22px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.applybtns .tx b{display:block;font-size:clamp(15px,3.8vw,17px);font-weight:800;}
.applybtns .tx span{font-size:clamp(13px,3.4vw,14.5px);color:var(--gray);font-weight:600;}
.seg{display:flex;gap:8px;margin:18px 0 4px;flex-wrap:wrap;}
.seg button{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--white);color:var(--gray);font-size:clamp(15px,4vw,18px);font-weight:800;padding:14px 6px;border-radius:14px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(243,129,0,.24);}
.hidden{display:none!important;}
.sec{font-size:clamp(20px,5vw,25px);font-weight:800;margin:34px 2px 16px;display:flex;align-items:center;gap:10px;letter-spacing:-.5px;}
.sec::before{content:"";width:6px;height:clamp(22px,5vw,26px);border-radius:3px;background:var(--accent);}
.steps{display:grid;grid-template-columns:1fr;gap:10px;}
.stp{display:flex;align-items:center;gap:16px;background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;}
.stp .n{flex:none;width:clamp(40px,9vw,48px);height:clamp(40px,9vw,48px);border-radius:50%;background:var(--accent);color:#fff;font-size:clamp(16px,4vw,19px);font-weight:800;display:flex;align-items:center;justify-content:center;}
.stp .t{font-size:clamp(16px,4.2vw,19px);font-weight:800;}
@media(min-width:760px){.steps{grid-template-columns:repeat(3,1fr);gap:12px;}}
.cards{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:600px){.cards{grid-template-columns:repeat(2,1fr);}}
@media(min-width:980px){.cards{grid-template-columns:repeat(3,1fr);}}
.vc{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 18px;}
.vc .h{display:flex;align-items:center;gap:11px;margin-bottom:9px;}
.vc .h .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;}
.vc .h .ic svg{width:22px;height:22px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.vc .h b{font-size:clamp(16.5px,4.2vw,19px);font-weight:800;}
.vc p{font-size:clamp(14.5px,3.8vw,16px);color:#4a4038;line-height:1.55;word-break:keep-all;}
.vc .tag{display:inline-block;margin-top:11px;font-size:clamp(12.5px,3.3vw,14px);font-weight:800;color:var(--action);background:var(--soft);padding:5px 12px;border-radius:11px;}
.benefits{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 20px;}
.bf{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);}
.bf:last-child{border-bottom:none;}
.bf svg{flex:none;width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.bf span{font-size:clamp(15.5px,4vw,17.5px);font-weight:700;color:#3c342d;word-break:keep-all;}
.note{background:var(--soft);border:1px solid #F3D6B0;border-radius:16px;padding:16px 18px;display:flex;gap:12px;margin-top:16px;align-items:flex-start;}
.note svg{flex:none;width:24px;height:24px;stroke:var(--brand);fill:none;stroke-width:2.2;margin-top:1px;}
.note b{font-size:clamp(14.5px,3.8vw,16.5px);font-weight:700;line-height:1.6;word-break:keep-all;}
.cta{margin-top:30px;background:linear-gradient(135deg,#F7B26A,#F38100);border-radius:20px;padding:clamp(24px,5vw,34px);text-align:center;box-shadow:0 10px 30px rgba(243,129,0,.25);}
.cta p{color:#fff;font-size:clamp(17px,4.4vw,21px);font-weight:800;line-height:1.5;word-break:keep-all;}
.cta a{display:inline-flex;align-items:center;gap:9px;margin-top:16px;background:#fff;color:var(--action);font-size:clamp(16px,4.2vw,19px);font-weight:800;padding:14px 30px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.14);}
.cta a svg{width:20px;height:20px;stroke:var(--action);fill:none;stroke-width:2.4;}
.none{color:var(--gray);padding:40px;text-align:center;}
/* 사진 갤러리 */
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px;}
@media(min-width:600px){.gallery{grid-template-columns:repeat(3,1fr);}}
@media(min-width:980px){.gallery{grid-template-columns:repeat(4,1fr);}}
.gallery .gi{border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;background:#f9f6f1;}
.gallery .gi img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block;background:#f9f6f1;transition:transform .2s;}
.gallery .gi:hover img{transform:scale(1.03);}
.gallery .gi .cap{font-size:clamp(12px,3.2vw,13.5px);font-weight:700;color:var(--gray);padding:8px 10px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* 라이트박스 */
.lb{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
.lb.on{opacity:1;pointer-events:auto;}
.lb img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
.lb .cap{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:#fff;font-size:16px;font-weight:700;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.6);max-width:80vw;}
.lb .close{position:absolute;top:18px;right:22px;color:#fff;font-size:36px;font-weight:800;cursor:pointer;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.5);}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:42px;font-weight:800;cursor:pointer;padding:12px;text-shadow:0 2px 8px rgba(0,0,0,.5);user-select:none;}
.lb .nav.prev{left:12px;}
.lb .nav.next{right:12px;}
</style></head>
<body>
<div class="wrap" id="app"><div class="none">불러오는 중…</div></div>
<div class="lb" id="lb" onclick="closeLb()">
  <span class="close" onclick="closeLb()">&times;</span>
  <span class="nav prev" onclick="event.stopPropagation();navLb(-1)">&#8249;</span>
  <img id="lbimg" src="" alt="">
  <span class="nav next" onclick="event.stopPropagation();navLb(1)">&#8250;</span>
  <div class="cap" id="lbcap"></div>
</div>
<script>
(function(){
  var APPLY_URL="https://www.bwsenior.or.kr/main/sub.html?pageCode=64";
  var IMG_BASE="data/자원봉사_img/";
  var IC={
    phone:'<path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012 4.2 2 2 0 014 2h3a2 2 0 012 1.7c.1.9.3 1.8.6 2.6a2 2 0 01-.5 2.1L8 9.6a16 16 0 006 6l1.2-1.1a2 2 0 012.1-.5c.8.3 1.7.5 2.6.6A2 2 0 0122 16.9z"/>',
    home:'<path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5"/>',

    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
    users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 21c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/><path d="M16 5a3.5 3.5 0 010 6M22 21c0-3-1.5-4.8-4-5.3"/>',
    clean:'<path d="M21 3L11 13"/><path d="M14.5 9.5l-8.5 8.5 3 3 8.5-8.5z"/><path d="M4 21l2-2M8 17l2 2"/>',
    music:'<path d="M9 18V5l12-2v13M9 9l12-2"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    health:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
    pill:'<path d="M10.5 3.5a5 5 0 017 7l-6 6a5 5 0 01-7-7z"/><path d="M8 8l8 8"/>',
    walk:'<circle cx="13" cy="4" r="2"/><path d="M11 21l2-6-3-2 1-5 3 2 2 2M9 21l2-6"/>',
    shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    star:'<path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4L12 17l-6.3 4.4L8 14 2 9.4h7.6z"/>',
    heart:'<path d="M20.8 5.6a5.5 5.5 0 00-7.8 0L12 6.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-6.6 1-1a5.5 5.5 0 000-7.8z"/>',
    hand:'<path d="M11 13V5a1.5 1.5 0 013 0v6M14 11V4a1.5 1.5 0 013 0v8M8 13V7a1.5 1.5 0 013 0v4M17 8a1.5 1.5 0 013 0v6a7 7 0 01-7 7h-1a7 7 0 01-6-3.5L5 15"/>',
    gift:'<path d="M20 12v9H4v-9M2 7h20v5H2zM12 22V7M12 7a3 3 0 10-3-3c0 2 3 3 3 3zM12 7a3 3 0 013-3c0 2-3 3-3 3z"/>',
    bread:'<path d="M4 3h16v4H4zM6 7v14h12V7M9 11h6"/>',
    coffee:'<path d="M4 8h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5zM17 9h2a2 2 0 010 4h-2M6 3v2M10 3v2M14 3v2"/>',
    mic:'<path d="M12 2a3 3 0 013 3v6a3 3 0 01-6 0V5a3 3 0 013-3zM5 11a7 7 0 0014 0M12 18v3"/>',
    mega:'<path d="M3 11v2a1 1 0 001 1h2l4 4V6L6 10H4a1 1 0 00-1 1zM15 8a5 5 0 010 8"/>',
    bell:'<path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/>',
    mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    book:'<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM19 3v16"/>',
    edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
    camera:'<path d="M3 8a2 2 0 012-2h2l2-2h6l2 2h2a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><circle cx="12" cy="13" r="3.5"/>',
    calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    car:'<path d="M5 13l1.5-4.5A2 2 0 018.4 7h7.2a2 2 0 011.9 1.5L19 13M5 13h14v5H5zM5 18v2M19 18v2"/><circle cx="7.5" cy="15.5" r="1"/><circle cx="16.5" cy="15.5" r="1"/>',
    bus:'<rect x="4" y="4" width="16" height="13" rx="2"/><path d="M4 11h16M8 17v2M16 17v2"/><circle cx="8" cy="14" r="1"/><circle cx="16" cy="14" r="1"/>',
    mappin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1116 0z"/><circle cx="12" cy="10" r="3"/>',
    leaf:'<path d="M11 20A7 7 0 014 13c0-6 8-9 16-9 0 8-3 16-9 16z"/><path d="M4 20c4-4 8-6 12-7"/>',
    flower:'<circle cx="12" cy="12" r="2.5"/><path d="M12 9.5c0-3 4-4 4-1s-4 1-4 1zM12 14.5c0 3-4 4-4 1s4-1 4-1zM9.5 12c-3 0-4-4-1-4s1 4 1 4zM14.5 12c3 0 4 4 1 4s-1-4-1-4z"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',
    smile:'<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',
    scissors:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8 8l12 10M8 16L20 6"/>',
    wrench:'<path d="M21 4a5 5 0 01-6.5 6.5L5 20l-2-2 9.5-9.5A5 5 0 0121 4z"/>',
    bank:'<path d="M3 21h18M4 21V10M20 21V10M4 10l8-6 8 6M9 21v-6h6v6"/>',
    card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
    box:'<path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/>',
    link:'<path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/>',
    receipt:'<path d="M5 3v18l2-1 2 1 2-1 2 1 2-1 2 1V3l-2 1-2-1-2 1-2-1-2 1z"/><path d="M9 8h6M9 12h6"/>',
    check:'<path d="M20 6L9 17l-5-5"/>'

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function svg(k){return '<svg viewBox="0 0 24 24">'+(IC[k]||IC.check)+'</svg>';}
  function tel(v){return 'tel:'+String(v).replace(/[^0-9]/g,'');}

  fetch('data/volunteer.json?t='+Date.now()).then(function(r){return r.json();}).then(render)
    .catch(function(){document.getElementById('app').innerHTML='<div class="none">내용을 불러오지 못했습니다.</div>';});

  // 라이트박스
  var lbPhotos=[],lbIdx=0,galleries=[];
  window.openLb=function(ti,i){
    lbPhotos=galleries[ti]||[];lbIdx=i;
    var lb=document.getElementById('lb');
    document.getElementById('lbimg').src=photos[i].src;
    document.getElementById('lbcap').textContent=photos[i].cap||'';
    lb.classList.add('on');
    document.body.style.overflow='hidden';
  };
  window.closeLb=function(){
    document.getElementById('lb').classList.remove('on');
    document.body.style.overflow='';
  };
  window.navLb=function(dir){
    lbIdx=(lbIdx+dir+lbPhotos.length)%lbPhotos.length;
    document.getElementById('lbimg').src=lbPhotos[lbIdx].src;
    document.getElementById('lbcap').textContent=lbPhotos[lbIdx].cap||'';
  };
  document.addEventListener('keydown',function(e){
    if(!document.getElementById('lb').classList.contains('on'))return;
    if(e.key==='Escape')closeLb();
    if(e.key==='ArrowLeft')navLb(-1);
    if(e.key==='ArrowRight')navLb(1);
  });

  function render(d){
    var 상단=d.상단||{};
    var 탭=d.탭||[];
    var h='';
    galleries=[];

    // 히어로
    h+='<div class="hero"><div class="bc">봉사·후원 <b>›</b> 자원봉사</div><h1>자원봉사</h1>';
    if(상단.소개) h+='<p>'+esc(상단.소개)+'</p>';
    if(상단.신청&&상단.신청.length){
      h+='<div class="applybtns">';
      상단.신청.forEach(function(a){
        var isTel=/[0-9]{3,}/.test(a.값)&&(a.아이콘==='phone'||/전화/.test(a.라벨));
        var href=isTel?tel(a.값):'javascript:void(0)';
        h+='<a href="'+href+'"><div class="ic">'+svg(a.아이콘||'home')+'</div><div class="tx"><b>'+esc(a.라벨)+'</b><span>'+esc(a.값)+'</span></div></a>';
      });
      h+='</div>';
    }
    h+='</div>';

    // 탭 버튼 (동적)
    if(탭.length>1){
      h+='<div class="seg" id="seg">';
      탭.forEach(function(t,i){
        h+='<button data-v="'+i+'"'+(i===0?' class="on"':'')+'>'+esc(t.이름)+'</button>';
      });
      h+='</div>';
    }

    // 탭 패널
    탭.forEach(function(t,i){
      h+='<div class="tabpanel'+(i>0?' hidden':'')+'" id="tp'+i+'">';
      // 카드
      if(t.카드&&t.카드.length){
        h+='<div class="sec">'+esc(t.이름)+'</div><div class="cards">';
        t.카드.forEach(function(c){
          h+='<div class="vc"><div class="h"><div class="ic">'+svg(c.아이콘)+'</div><b>'+esc(c.이름)+'</b></div>'
            +(c.설명?'<p>'+esc(c.설명)+'</p>':'')+(c.태그?'<span class="tag">'+esc(c.태그)+'</span>':'')+'</div>';
        });
        h+='</div>';
      }
      // 절차
      if(t.절차&&t.절차.length){
        h+='<div class="sec">봉사 신청 절차</div><div class="steps">';
        t.절차.forEach(function(s,j){h+='<div class="stp"><div class="n">'+(j+1)+'</div><div class="t">'+esc(s)+'</div></div>';});
        h+='</div>';
      }
      // 혜택
      if(t.혜택&&t.혜택.length){
        h+='<div class="sec">자원봉사자 혜택</div><div class="benefits">';
        t.혜택.forEach(function(b){h+='<div class="bf">'+svg('check')+'<span>'+esc(b)+'</span></div>';});
        h+='</div>';
      }
      // 안내
      if(t.안내) h+='<div class="note"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg><b>'+esc(t.안내)+'</b></div>';
      // 사진 갤러리
      if(t.사진&&t.사진.length){
        galleries[i]=t.사진.map(function(p){return{src:IMG_BASE+p.파일,cap:p.캡션||''};});
        h+='<div class="sec">활동 사진</div><div class="gallery">';
        t.사진.forEach(function(p,pi){
          var src=IMG_BASE+esc(p.파일);
          h+='<div class="gi" onclick="openLb('+i+','+pi+')"><img src="'+src+'" alt="'+esc(p.캡션||p.파일)+'" loading="lazy"><div class="cap">'+esc(p.캡션||'')+'</div></div>';
        });
        h+='</div>';
      }
      h+='</div>';
    });

    // CTA
    h+='<div class="cta"><p>지금 바로 자원봉사에 함께해 주세요</p>'
      +'<a href="'+APPLY_URL+'" target="_top"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>봉사 신청하기</a></div>';

    document.getElementById('app').innerHTML=h;

    // 탭 전환
    var seg=document.getElementById('seg');
    if(seg){
      seg.querySelectorAll('button').forEach(function(b){
        b.addEventListener('click',function(){
          seg.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
          b.classList.add('on');
          var v=+b.dataset.v;
          탭.forEach(function(_,j){
            var el=document.getElementById('tp'+j);
            if(el)el.classList.toggle('hidden',j!==v);
          });
          window.scrollTo(0,0);sendHeight();
        });
      });
    }
    sendHeight();
  }

  function sendHeight(){try{var h=Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height)+12;parent.postMessage({bwVolunteer:'height',height:h},'*');}catch(e){}}
  window.addEventListener('load',sendHeight);window.addEventListener('resize',sendHeight);
  setTimeout(sendHeight,600);setTimeout(sendHeight,1500);
})();
</script>
</body></html>
