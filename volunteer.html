<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자원봉사 · 북원노인종합복지관</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
:root{--brand:#F38100;--action:#8A4200;--ink:#2B2320;--gray:#6B655F;--line:#EAE2D6;--soft:#FDF0E2;--white:#fff;--accent:#2E8B77;--accent-soft:#E4F1EC;--shadow:0 6px 20px rgba(120,90,50,.08);--r:18px;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:#fff;}
body{font-family:'Pretendard','Apple SD Gothic Neo','맑은 고딕',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.wrap{max-width:1465px;margin:0;padding:6px 16px 30px;}
a{color:inherit;text-decoration:none;}
.hero{padding:4px 2px 2px;margin:0 0 6px;}
.hero .bc{font-size:clamp(13px,3.4vw,14px);color:var(--gray);font-weight:700;margin-bottom:8px;}
.hero .bc b{color:var(--brand);}
.hero h1{font-size:clamp(27px,6vw,38px);font-weight:800;letter-spacing:-1px;}
.hero p{font-size:clamp(15.5px,4vw,18px);color:#5a5149;line-height:1.65;margin-top:12px;word-break:keep-all;max-width:760px;}
.applybtns{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;}
.applybtns a{display:flex;align-items:center;gap:11px;background:var(--white);border:1.5px solid var(--line);border-radius:15px;padding:14px 20px;box-shadow:var(--shadow);}
.applybtns .ic{width:42px;height:42px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;}
.applybtns .ic svg{width:22px;height:22px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.applybtns .tx b{display:block;font-size:clamp(15px,3.8vw,17px);font-weight:800;}
.applybtns .tx span{font-size:clamp(13px,3.4vw,14.5px);color:var(--gray);font-weight:600;}
.seg{display:flex;gap:8px;margin:18px 0 4px;}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--white);color:var(--gray);font-size:clamp(15px,4vw,18px);font-weight:800;padding:14px 6px;border-radius:14px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow);}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(243,129,0,.24);}
.hidden{display:none!important;}
.sec{font-size:clamp(20px,5vw,25px);font-weight:800;margin:34px 2px 16px;display:flex;align-items:center;gap:10px;letter-spacing:-.5px;}
.sec::before{content:"";width:6px;height:clamp(22px,5vw,26px);border-radius:3px;background:var(--accent);}
.steps{display:grid;grid-template-columns:1fr;gap:10px;}
.stp{display:flex;align-items:center;gap:16px;background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;}
.stp .n{flex:none;width:clamp(40px,9vw,48px);height:clamp(40px,9vw,48px);border-radius:50%;background:var(--accent);color:#fff;font-size:clamp(16px,4vw,19px);font-weight:800;display:flex;align-items:center;justify-content:center;}
.stp .t{font-size:clamp(16px,4.2vw,19px);font-weight:800;}
@media(min-width:760px){.steps{grid-template-columns:repeat(3,1fr);gap:12px;}}
.cards{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:600px){.cards{grid-template-columns:repeat(2,1fr);}}
@media(min-width:980px){.cards{grid-template-columns:repeat(3,1fr);}}
.vc{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 18px;}
.vc .h{display:flex;align-items:center;gap:11px;margin-bottom:9px;}
.vc .h .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;}
.vc .h .ic svg{width:22px;height:22px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.vc .h b{font-size:clamp(16.5px,4.2vw,19px);font-weight:800;}
.vc p{font-size:clamp(14.5px,3.8vw,16px);color:#4a4038;line-height:1.55;word-break:keep-all;}
.vc .tag{display:inline-block;margin-top:11px;font-size:clamp(12.5px,3.3vw,14px);font-weight:800;color:var(--action);background:var(--soft);padding:5px 12px;border-radius:11px;}
.senior .vc .h .ic{background:var(--accent-soft);}
.senior .vc .h .ic svg{stroke:var(--accent);}
.benefits{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 20px;}
.bf{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);}
.bf:last-child{border-bottom:none;}
.bf svg{flex:none;width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.bf span{font-size:clamp(15.5px,4vw,17.5px);font-weight:700;color:#3c342d;word-break:keep-all;}
.note{background:var(--soft);border:1px solid #F3D6B0;border-radius:16px;padding:16px 18px;display:flex;gap:12px;margin-top:16px;align-items:flex-start;}
.note svg{flex:none;width:24px;height:24px;stroke:var(--brand);fill:none;stroke-width:2.2;margin-top:1px;}
.note b{font-size:clamp(14.5px,3.8vw,16.5px);font-weight:700;line-height:1.6;word-break:keep-all;}
.cta{margin-top:30px;background:linear-gradient(135deg,#F7B26A,#F38100);border-radius:20px;padding:clamp(24px,5vw,34px);text-align:center;box-shadow:0 10px 30px rgba(243,129,0,.25);}
.cta p{color:#fff;font-size:clamp(17px,4.4vw,21px);font-weight:800;line-height:1.5;word-break:keep-all;}
.cta a{display:inline-flex;align-items:center;gap:9px;margin-top:16px;background:#fff;color:var(--action);font-size:clamp(16px,4.2vw,19px);font-weight:800;padding:14px 30px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.14);}
.cta a svg{width:20px;height:20px;stroke:var(--action);fill:none;stroke-width:2.4;}
.none{color:var(--gray);padding:40px;text-align:center;}
</style></head>
<body>
<div class="wrap" id="app"><div class="none">불러오는 중…</div></div>
<script>
(function(){
  var APPLY_URL="https://www.bwsenior.or.kr/main/sub.html?pageCode=64"; // 봉사 신청 게시판
  var IC={
    phone:'<path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012 4.2 2 2 0 014 2h3a2 2 0 012 1.7c.1.9.3 1.8.6 2.6a2 2 0 01-.5 2.1L8 9.6a16 16 0 006 6l1.2-1.1a2 2 0 012.1-.5c.8.3 1.7.5 2.6.6A2 2 0 0122 16.9z"/>',
    home:'<path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5"/>',
    meal:'<path d="M3 11h18M5 11V8a7 7 0 0114 0v3M4 11v6a3 3 0 003 3h10a3 3 0 003-3v-6"/>',
    talk:'<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
    music:'<path d="M9 18V5l12-2v13M9 9l12-2"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    health:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
    shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    star:'<path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4L12 17l-6.3 4.4L8 14 2 9.4h7.6z"/>',
    bread:'<path d="M4 3h16v4H4zM6 7v14h12V7M9 11h6"/>',
    mic:'<path d="M12 2a3 3 0 013 3v6a3 3 0 01-6 0V5a3 3 0 013-3zM5 11a7 7 0 0014 0M12 18v3"/>',
    check:'<path d="M20 6L9 17l-5-5"/>'
  };
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function svg(k){return '<svg viewBox="0 0 24 24">'+(IC[k]||IC.check)+'</svg>';}
  function tel(v){return 'tel:'+String(v).replace(/[^0-9]/g,'');}

  fetch('data/volunteer.json?t='+Date.now()).then(function(r){return r.json();}).then(render)
    .catch(function(){document.getElementById('app').innerHTML='<div class="none">내용을 불러오지 못했습니다.</div>';});

  function render(d){
    var h='';
    h+='<div class="hero"><div class="bc">봉사·후원 <b>›</b> 자원봉사</div><h1>자원봉사</h1>';
    if(d.소개) h+='<p>'+esc(d.소개)+'</p>';
    if(d.신청&&d.신청.length){
      h+='<div class="applybtns">';
      d.신청.forEach(function(a){
        var isTel=/[0-9]{3,}/.test(a.값)&&(a.아이콘==='phone'||/전화/.test(a.라벨));
        var href=isTel?tel(a.값):'javascript:void(0)';
        h+='<a href="'+href+'"><div class="ic">'+svg(a.아이콘||'home')+'</div><div class="tx"><b>'+esc(a.라벨)+'</b><span>'+esc(a.값)+'</span></div></a>';
      });
      h+='</div>';
    }
    h+='</div>';

    // 상단 탭 (3개)
    h+='<div class="seg" id="seg">'
      +'<button data-v="gen" class="on">일반 봉사</button>'
      +'<button data-v="sen">시니어 봉사</button>'
      +'<button data-v="info">신청 절차·혜택</button></div>';

    // 일반 봉사 뷰
    h+='<div id="vGen">';
    if(d.일반봉사&&d.일반봉사.length){
      h+='<div class="sec">일반 봉사</div><div class="cards">';
      d.일반봉사.forEach(function(v){
        h+='<div class="vc"><div class="h"><div class="ic">'+svg(v.아이콘)+'</div><b>'+esc(v.이름)+'</b></div>'
          +(v.설명?'<p>'+esc(v.설명)+'</p>':'')+(v.태그?'<span class="tag">'+esc(v.태그)+'</span>':'')+'</div>';
      });
      h+='</div>';
    }
    h+='</div>';

    // 시니어 봉사 뷰
    h+='<div id="vSen" class="hidden">';
    if(d.시니어봉사&&d.시니어봉사.length){
      h+='<div class="sec">시니어 봉사</div><div class="cards senior">';
      d.시니어봉사.forEach(function(v){
        h+='<div class="vc"><div class="h"><div class="ic">'+svg(v.아이콘)+'</div><b>'+esc(v.이름)+'</b></div>'
          +(v.설명?'<p>'+esc(v.설명)+'</p>':'')+'</div>';
      });
      h+='</div>';
    }
    h+='</div>';

    // 신청 절차·혜택 뷰
    h+='<div id="vInfo" class="hidden">';
    if(d.절차&&d.절차.length){
      h+='<div class="sec">봉사 신청 절차</div><div class="steps">';
      d.절차.forEach(function(t,i){ h+='<div class="stp"><div class="n">'+(i+1)+'</div><div class="t">'+esc(t)+'</div></div>'; });
      h+='</div>';
    }
    if(d.혜택&&d.혜택.length){
      h+='<div class="sec">자원봉사자 혜택</div><div class="benefits">';
      d.혜택.forEach(function(t){ h+='<div class="bf">'+svg('check')+'<span>'+esc(t)+'</span></div>'; });
      h+='</div>';
    }
    if(d.안내) h+='<div class="note"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg><b>'+esc(d.안내)+'</b></div>';
    h+='</div>';

    h+='<div class="cta"><p>지금 바로 자원봉사에 함께해 주세요</p>'
      +'<a href="'+APPLY_URL+'" target="_top"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>봉사 신청하기</a></div>';

    document.getElementById('app').innerHTML=h;
    var seg=document.getElementById('seg');
    seg.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click',function(){
        seg.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
        b.classList.add('on');
        var v=b.dataset.v;
        document.getElementById('vGen').classList.toggle('hidden', v!=='gen');
        document.getElementById('vSen').classList.toggle('hidden', v!=='sen');
        document.getElementById('vInfo').classList.toggle('hidden', v!=='info');
        window.scrollTo(0,0); sendHeight();
      });
    });
    sendHeight();
  }
  function sendHeight(){try{var h=Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height)+12;parent.postMessage({bwVolunteer:'height',height:h},'*');}catch(e){}}
  window.addEventListener('load',sendHeight);window.addEventListener('resize',sendHeight);
  setTimeout(sendHeight,600);setTimeout(sendHeight,1500);
})();
</script>
</body></html>
