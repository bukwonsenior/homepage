<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 식단 · 북원노인종합복지관</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  :root{--brand:#F38100;--action:#8A4200;--ink:#2B2320;--gray:#595757;--line:#E4DCD2;--cream2:#F1EAE0;--soft:#FDF0E2;--white:#fff;--r:18px;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:transparent;}
  body{font-family:'Pretendard','Apple SD Gothic Neo','맑은 고딕',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  /* ===== 공통 카드 규격 (3개 창 동일) ===== */
  .card{display:flex;flex-direction:column;min-width:0;min-height:340px;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;}
  .eyeline{font-size:15px;letter-spacing:.12em;font-weight:800;color:var(--brand);display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .eyeline::after{content:"";flex:1;height:1px;background:var(--line);}
  .link{margin-top:auto;display:flex;align-items:center;justify-content:flex-end;gap:8px;border-top:1px solid var(--cream2);padding-top:14px;font-size:16px;font-weight:800;color:var(--action);min-height:44px;}
  .link svg{width:16px;height:16px;stroke:var(--action);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  a{color:inherit;text-decoration:none;}
  /* ===== 콘텐츠 ===== */
  .date{font-size:14.5px;color:var(--gray);font-weight:600;}
  .meal{font-size:19px;font-weight:800;line-height:1.5;letter-spacing:-.4px;margin-top:8px;}
  .none{font-size:17px;font-weight:700;color:var(--gray);line-height:1.6;margin-top:8px;}
  .vol{margin-top:16px;padding-top:16px;border-top:1px solid var(--cream2);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;}
  .vol .vlabel{font-size:14px;font-weight:800;color:#fff;background:var(--brand);padding:7px 16px;border-radius:20px;}
  .vol .vname{font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.35;color:var(--ink);}
  /* ===== PC(넓을 때) 크게 ===== */
  @media (min-width:480px){
    .eyeline{font-size:20px;letter-spacing:.08em;}
    .link{font-size:17px;}
    .date{font-size:15.5px;}
    .meal{font-size:21px;}
    .vol .vlabel{font-size:15px;}
    .vol .vname{font-size:21px;}
  }
</style>
</head>
<body>
<section class="card">
  <div class="eyeline">TODAY · 오늘의 식단</div>
  <div class="date" id="date">불러오는 중…</div>
  <div class="meal" id="meal"></div>
  <div class="vol" id="vol" style="display:none">
    <span class="vlabel">오늘의 봉사단</span>
    <span class="vname" id="vname"></span>
  </div>
  <a class="link" id="more" href="https://www.bwsenior.or.kr/main/sub.html?pageCode=13" target="_top">
    <span>이번 달 식단표 보기</span>
    <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
  </a>
</section>

<script>
(function(){
  var DOW=['일','월','화','수','목','금','토'];
  var now=new Date();
  var y=now.getFullYear(), m=now.getMonth()+1, d=now.getDate();
  var key=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  document.getElementById('date').textContent = m+'월 '+d+'일 '+DOW[now.getDay()]+'요일';

  function render(items){
    var meal=document.getElementById('meal');
    if(items && items.length){
      var half=Math.ceil(items.length/2);
      meal.innerHTML = items.slice(0,half).join(' · ') + '<br>' + items.slice(half).join(' · ');
    }else{
      meal.className='none';
      meal.textContent = (now.getDay()===0||now.getDay()===6)
        ? '주말·공휴일은 식당을 운영하지 않습니다.'
        : '오늘 등록된 식단이 없습니다.';
    }
    sendHeight();
  }
  function renderVol(name){
    if(name){ document.getElementById('vname').textContent=name; document.getElementById('vol').style.display='flex'; }
    sendHeight();
  }

  fetch('menu.json?t='+Date.now())
    .then(function(r){ return r.json(); })
    .then(function(j){ render((j.days||{})[key]); renderVol((j.bongsa||{})[key]); })
    .catch(function(){ render(null); });

  function sendHeight(){ var h=Math.ceil(document.querySelector('.card').getBoundingClientRect().height); try{ parent.postMessage({bwMeal:'height',height:h},'*'); }catch(e){} }
  window.addEventListener('load',sendHeight); window.addEventListener('resize',sendHeight);
  if(window.ResizeObserver) new ResizeObserver(sendHeight).observe(document.body);
  setTimeout(sendHeight,500); setTimeout(sendHeight,1500);
})();
</script>
</body>
</html>
