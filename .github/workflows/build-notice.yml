name: 공지사항 자동 갱신

on:
  schedule:
    - cron: "20 21 * * *"   # 매일 06:20 KST (UTC 21:20 전날)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python build_notice.py
      - name: 바뀐 내용 저장
        run: |
          if git diff --quiet -- notice.json; then
            echo "바뀐 내용이 없습니다."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notice.json
          git commit -m "공지사항 갱신: CMS → notice.json"
          git pull --rebase --autostash origin main
          git push
