name: 이달의 식단 자동 갱신

on:
  schedule:
    - cron: '10 21 * * *'   # 매일 06:10 KST (UTC 21:10 전날)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: 식단표 긁어서 menu.json 만들기
        run: python build_menu.py
      - name: 바뀐 내용 저장
        run: |
          if git diff --quiet -- menu.json; then
            echo "바뀐 내용이 없습니다."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.json
          git commit -m "식단 갱신: CMS → menu.json"
          git pull --rebase --autostash origin main
          git push
