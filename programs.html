<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로그램 안내 · 북원노인종합복지관</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  :root{--brand:#F38100;--action:#8A4200;--ink:#2B2320;--gray:#6B655F;--line:#EAE2D6;--cream:#FAF7F2;--soft:#FDF0E2;--white:#fff;--accent:#2E8B77;--accent-soft:#E4F1EC;--shadow:0 6px 20px rgba(120,90,50,.08);--r:18px;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--cream);}
  body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:900px;margin:0 auto;padding:8px 16px 26px;}
  a{color:inherit;text-decoration:none;}
  .hidden{display:none!important;}

  /* ===== 목록 ===== */
  .apply{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px;}
  .apply .st{display:inline-block;font-size:13px;font-weight:800;padding:5px 13px;border-radius:20px;margin-bottom:10px;}
  .apply .st.open{background:var(--accent-soft);color:var(--accent);}
  .apply .st.closed{background:#F0ECE5;color:var(--gray);}
  .apply h2{font-size:20px;font-weight:800;margin-bottom:10px;letter-spacing:-.4px;}
  .apply .grid{display:flex;flex-wrap:wrap;gap:8px 22px;}
  .apply .it{font-size:15.5px;min-width:150px;}
  .apply .it b{color:var(--gray);font-weight:600;margin-right:8px;}
  .apply .note{margin-top:12px;font-size:15px;color:var(--action);font-weight:600;line-height:1.5;white-space:pre-line;background:var(--soft);border-radius:12px;padding:11px 14px;}

  .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tab{flex:1;border:1.5px solid var(--line);background:var(--white);color:var(--gray);font-size:16px;font-weight:800;padding:11px 6px;border-radius:14px;cursor:pointer;font-family:inherit;text-align:center;transition:.12s;}
  .tab.on{background:var(--brand);border-color:var(--brand);color:#fff;}
  .tab .c{font-size:13px;opacity:.85;margin-left:3px;}

  .plist{display:flex;flex-direction:column;gap:11px;}
  .pcard{display:flex;align-items:center;gap:14px;background:var(--white);border-radius:16px;box-shadow:var(--shadow);padding:15px 16px;cursor:pointer;transition:.12s;}
  .pcard:hover{transform:translateY(-1px);}
  .pthumb{flex:none;width:60px;height:60px;border-radius:14px;background:linear-gradient(135deg,#F7B26A,#F38100);display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;}
  .pthumb svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.8;}
  .pinfo{flex:1;min-width:0;}
  .pinfo .nm{font-size:18px;font-weight:800;letter-spacing:-.3px;}
  .pinfo .meta{font-size:14.5px;color:var(--gray);margin-top:3px;}
  .pfee{flex:none;font-size:14px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:5px 11px;border-radius:12px;}
  .pfee.paid{color:var(--action);background:var(--soft);}
  .empty{text-align:center;color:var(--gray);font-size:16px;padding:36px 0;}

  /* ===== 상세 ===== */
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .back{width:44px;height:44px;border-radius:14px;background:var(--white);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .back svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .top .t{font-size:20px;font-weight:800;}
  .hero{position:relative;height:200px;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px;background:linear-gradient(135deg,#F7B26A,#F38100);background-size:cover;background-position:center;display:flex;align-items:flex-end;}
  .hero .cap{position:relative;width:100%;padding:18px;background:linear-gradient(transparent,rgba(50,30,8,.62));}
  .b{display:inline-block;font-size:13px;font-weight:800;padding:5px 13px;border-radius:20px;}
  .b.cat{background:var(--action);color:#fff;}
  .b.sub{background:rgba(255,255,255,.92);color:var(--action);margin-left:6px;}
  .hero .nm{font-size:27px;font-weight:800;color:#fff;margin-top:9px;letter-spacing:-.6px;}
  .card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);padding:6px 20px;margin-bottom:14px;}
  .row{display:flex;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row .k{width:76px;font-size:16px;color:var(--gray);font-weight:600;}
  .row .v{flex:1;font-size:18px;font-weight:800;}
  .warn{background:var(--soft);border:1px solid #F3D6B0;border-radius:16px;padding:15px 18px;display:flex;gap:12px;margin-bottom:20px;}
  .warn svg{flex:none;width:24px;height:24px;stroke:var(--brand);fill:none;stroke-width:2.2;margin-top:1px;}
  .warn b{font-size:17px;font-weight:800;line-height:1.5;}
  .sec{font-size:21px;font-weight:800;margin:4px 2px 12px;display:flex;align-items:center;gap:9px;}
  .sec::before{content:"";width:5px;height:20px;border-radius:3px;background:var(--accent);}
  .step{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);}
  .step:last-child{border-bottom:none;}
  .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .step b{font-size:17px;font-weight:800;}
  .step p{font-size:15px;color:var(--gray);margin-top:3px;white-space:pre-line;line-height:1.5;}
  .callnote{text-align:center;color:var(--gray);font-size:16px;line-height:1.6;margin:20px 0 12px;}
  .call{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--brand);color:#fff;font-size:22px;font-weight:800;height:60px;border-radius:16px;box-shadow:0 8px 22px rgba(243,129,0,.28);}
  .call svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;}
</style>
</head>
<body>
<div class="wrap">
  <!-- 목록 -->
  <div id="listView">
    <div class="apply" id="applyBox"></div>
    <div class="tabs" id="tabs"></div>
    <div class="plist" id="plist"></div>
  </div>
  <!-- 상세 -->
  <div id="detailView" class="hidden"></div>
</div>

<script>
(function(){
  var DATA=null, curCat=null, ICON='<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>';
  var CATS=['평생교육','동아리','특강'];

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function telLink(t){t=esc(t);return t?'<a href="tel:'+t.replace(/[^0-9]/g,'')+'">'+t+'</a>':'-';}
  function days(arr){return (arr&&arr.length)?arr.join('·')+'요일':'';}
  function timeRange(p){return (p.시작시간||'')+(p.종료시간?' – '+p.종료시간:'');}
  function periodRange(p){return fmtDate(p.운영시작)+(p.운영종료?' – '+fmtDate(p.운영종료):'');}
  function fmtDate(d){if(!d)return '';var m=String(d).match(/(\d{4})-(\d{2})-(\d{2})/);return m?(+m[2])+'월 '+(+m[3])+'일':d;}

  function renderApply(){
    var a=DATA.신청안내||{}, box=document.getElementById('applyBox');
    var open = a.현재상태 && a.현재상태.indexOf('아님')<0;
    var html='<span class="st '+(open?'open':'closed')+'">'+(open?'지금 신청할 수 있어요':'지금은 신청 기간이 아닙니다')+'</span>';
    html+='<h2>수강 신청 안내</h2><div class="grid">';
    var items=[['신청 방법',a.신청방법],['신청 대상',a.신청대상],['신청 개수',a.신청개수],['선정 방법',a.선정방법]];
    items.forEach(function(it){ if(it[1]) html+='<div class="it"><b>'+esc(it[0])+'</b>'+esc(it[1])+'</div>'; });
    html+='</div>';
    if(!open && a.신청기간아닐때_문구) html+='<div class="note">'+esc(a.신청기간아닐때_문구)+'</div>';
    box.innerHTML=html;
  }

  function renderTabs(){
    document.getElementById('tabs').innerHTML=CATS.map(function(c){
      var n=DATA.프로그램.filter(function(p){return p.구분===c;}).length;
      return '<button class="tab'+(c===curCat?' on':'')+'" data-c="'+c+'">'+c+'<span class="c">'+n+'</span></button>';
    }).join('');
  }

  function renderList(){
    var items=DATA.프로그램.filter(function(p){return p.구분===curCat;});
    // 요일 → 시작시간 순 정렬
    var order={'월':1,'화':2,'수':3,'목':4,'금':5,'토':6,'일':7};
    items.sort(function(a,b){
      var da=(a.요일&&a.요일[0]?order[a.요일[0]]:9)-(b.요일&&b.요일[0]?order[b.요일[0]]:9);
      if(da) return da; return (a.시작시간||'').localeCompare(b.시작시간||'');
    });
    var el=document.getElementById('plist');
    if(!items.length){ el.innerHTML='<div class="empty">등록된 프로그램이 없습니다.</div>'; sendHeight(); return; }
    el.innerHTML=items.map(function(p){
      var paid=(p.수강료||0)>0;
      var thumb=p.사진?' style="background-image:url('+esc(p.사진)+')"':'';
      return '<div class="pcard" data-id="'+esc(p.id)+'">'
        + '<div class="pthumb"'+thumb+'>'+(p.사진?'':ICON)+'</div>'
        + '<div class="pinfo"><div class="nm">'+esc(p.이름)+'</div>'
        +   '<div class="meta">'+esc(days(p.요일))+' '+esc(timeRange(p))+' · '+esc(p.장소||'')+'</div></div>'
        + '<div class="pfee'+(paid?' paid':'')+'">'+esc(p.수강료표시||'무료')+'</div>'
        + '</div>';
    }).join('');
    el.querySelectorAll('.pcard').forEach(function(c){ c.addEventListener('click',function(){location.hash='p/'+c.dataset.id;}); });
    sendHeight();
  }

  function renderDetail(id){
    var p=DATA.프로그램.filter(function(x){return x.id===id;})[0];
    if(!p){ location.hash=''; return; }
    var a=DATA.신청안내||{};
    var paid=(p.수강료||0)>0;
    var hero=p.사진?' style="background-image:url('+esc(p.사진)+')"':'';
    var h='';
    h+='<div class="top"><div class="back" onclick="history.back()"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div><div class="t">프로그램 안내</div></div>';
    h+='<div class="hero"'+hero+'><div class="cap"><span class="b cat">'+esc(p.구분)+'</span>'
      + (p.분류?'<span class="b sub">'+esc(p.분류)+'</span>':'')
      + '<div class="nm">'+esc(p.이름)+'</div></div></div>';
    h+='<div class="card">'
      + row('언제', esc(days(p.요일))+' '+esc(timeRange(p)))
      + row('기간', esc(periodRange(p)))
      + row('어디서', esc(p.장소))
      + row('강사', esc(p.강사))
      + row('정원', p.정원?esc(p.정원)+'명':'-')
      + row('수강료', esc(p.수강료표시||'무료')+(p.재료비별도?' <span style="font-size:14px;color:var(--gray);font-weight:600">(재료비 별도)</span>':''))
      + '</div>';
    if(p.안내문구) h+='<div class="warn"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L2 18a2 2 0 001.7 3h16.6a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg><b>'+esc(p.안내문구)+'</b></div>';
    // 신청 스텝
    h+='<div class="sec">신청은 이렇게 하세요</div><div class="card">'
      + step(1,'신청 기간에 신청하세요', esc(a.신청방법||'복지관 방문 신청'))
      + step(2,'많으면 추첨합니다', esc(a.선정방법||'정원을 넘으면 무작위 추첨'))
      + step(3,'결과를 알려드립니다', esc(a.선정발표_방법||'개별 문자 안내'))
      + '</div>';
    var tel=a.문의전화||DATA.문의전화;
    h+='<div class="callnote">이 프로그램이 궁금하시면<br>전화로 물어보세요.</div>';
    h+='<a class="call" href="tel:'+esc(tel).replace(/[^0-9]/g,'')+'"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012 4.2 2 2 0 014 2h3a2 2 0 012 1.7c.1.9.3 1.8.6 2.6a2 2 0 01-.5 2.1L8 9.6a16 16 0 006 6l1.2-1.1a2 2 0 012.1-.5c.8.3 1.7.5 2.6.6A2 2 0 0122 16.9z"/></svg>'+esc(tel)+'</a>';
    document.getElementById('detailView').innerHTML=h;
    sendHeight();
  }
  function row(k,v){return '<div class="row"><div class="k">'+k+'</div><div class="v">'+(v||'-')+'</div></div>';}
  function step(n,t,p){return '<div class="step"><div class="num">'+n+'</div><div><b>'+t+'</b><p>'+p+'</p></div></div>';}

  function route(){
    var h=location.hash.replace(/^#/,'');
    var lv=document.getElementById('listView'), dv=document.getElementById('detailView');
    if(h.indexOf('p/')===0){
      lv.classList.add('hidden'); dv.classList.remove('hidden');
      renderDetail(h.slice(2)); window.scrollTo(0,0);
    } else {
      dv.classList.add('hidden'); lv.classList.remove('hidden');
      sendHeight();
    }
  }
  window.addEventListener('hashchange',route);

  fetch('data/programs.json?t='+Date.now()).then(function(r){return r.json();}).then(function(j){
    DATA=j; curCat=CATS[0];
    renderApply(); renderTabs(); renderList(); route();
    document.getElementById('tabs').addEventListener('click',function(e){
      var b=e.target.closest('.tab'); if(!b)return; curCat=b.dataset.c; renderTabs(); renderList();
    });
  }).catch(function(){ document.getElementById('plist').innerHTML='<div class="empty">프로그램 정보를 불러오지 못했습니다.</div>'; });

  function sendHeight(){ try{var h=Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height)+10; parent.postMessage({bwPrograms:'height',height:h},'*'); }catch(e){} }
  window.addEventListener('load',sendHeight); window.addEventListener('resize',sendHeight);
  setTimeout(sendHeight,700); setTimeout(sendHeight,1600);
})();
</script>
</body>
</html>
