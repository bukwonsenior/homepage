<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로그램 안내 · 북원노인종합복지관</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  :root{--brand:#F38100;--action:#8A4200;--ink:#2B2320;--gray:#6B655F;--line:#EAE2D6;--cream:#FAF7F2;--soft:#FDF0E2;--white:#fff;--accent:#2E8B77;--accent-soft:#E4F1EC;--shadow:0 6px 20px rgba(120,90,50,.08);--r:18px;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:#fff;}
  body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1200px;margin:0;padding:8px 16px 26px;}
  a{color:inherit;text-decoration:none;}
  .hidden{display:none!important;}

  /* ===== 목록 ===== */
  .apply{background:transparent;padding:0;margin-bottom:18px;}
  .apply .st{display:inline-block;font-size:clamp(13.8px,calc(12.82px + 0.252vw),15.6px);font-weight:800;padding:5px 13px;border-radius:20px;margin-bottom:10px;}
  .apply .st.open{background:var(--accent-soft);color:var(--accent);}
  .apply .st.closed{background:#F0ECE5;color:var(--gray);}
  .apply h2{font-size:clamp(21.2px,calc(19.72px + 0.388vw),24px);font-weight:800;margin-bottom:10px;letter-spacing:-.4px;}
  .apply .grid{display:flex;flex-direction:column;gap:2px;}
  .apply .it{font-size:clamp(17px,calc(15.78px + 0.31vw),19.2px);display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #F2ECE2;}
  .apply .it:last-child{border-bottom:none;}
  .apply .it .lbl{flex:none;min-width:74px;white-space:nowrap;padding-left:8px!important;padding-right:8px!important;text-align:center;background:var(--soft);color:var(--action);font-weight:800;font-size:clamp(14.3px,calc(13.31px + 0.262vw),16.2px);padding:5px 0;border-radius:9px;}
  .apply .it .val{flex:1;color:var(--ink);font-weight:700;}
  .apply .note{margin-top:12px;font-size:clamp(15.9px,calc(14.79px + 0.291vw),18px);color:var(--action);font-weight:600;line-height:1.5;white-space:pre-line;background:var(--soft);border-radius:12px;padding:11px 14px;}
  .apply .subh{font-size:clamp(15.9px,calc(14.79px + 0.291vw),18px);font-weight:800;color:var(--action);margin:16px 0 9px;display:flex;align-items:center;gap:7px;}
  .apply .subh::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--accent);}
  .apply .proc{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;margin-bottom:2px;}
  .apply .proc .p{background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:clamp(14.8px,calc(13.8px + 0.272vw),16.8px);padding:7px 12px;border-radius:10px;}
  .apply .proc .ar{color:var(--gray);font-weight:800;font-size:clamp(14.8px,calc(13.8px + 0.272vw),16.8px);}
  .apply .rules{list-style:none;display:flex;flex-direction:column;gap:8px;}
  .apply .rules li{position:relative;padding-left:20px;font-size:clamp(15.9px,calc(14.79px + 0.291vw),18px);line-height:1.55;color:#40382f;word-break:keep-all;}
  .apply .rules li::before{content:"";position:absolute;left:2px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--brand);}
.apply .more{display:flex;flex-direction:column;gap:8px;}
  .apply .more details{background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);}
  .apply .more summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;font-size:clamp(15.9px,calc(14.79px + 0.291vw),18px);font-weight:800;color:var(--ink);}
  .apply .more summary::-webkit-details-marker{display:none;}
  .apply .more summary svg{flex:none;width:20px;height:20px;stroke:var(--brand);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;}
  .apply .more details[open] summary svg{transform:rotate(180deg);}
  .apply .more .mb{padding:0 16px 15px;font-size:clamp(15.4px,calc(14.3px + 0.28vw),17.4px);line-height:1.65;color:#40382f;white-space:pre-line;word-break:keep-all;}
  .apply .it .val a{color:var(--action);}
.flyer{display:flex;align-items:center;gap:14px;margin:22px 0 4px;padding:16px 18px;border-radius:16px;background:var(--white);border:1.5px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);}
  .flyer:hover{border-color:var(--brand);}
  .flyer .fi{flex:none;width:48px;height:48px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;}
  .flyer .fi svg{width:26px;height:26px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .flyer .ft{flex:1;display:flex;flex-direction:column;gap:3px;}
  .flyer .ft b{font-size:clamp(17px,calc(15.78px + 0.31vw),19.2px);font-weight:800;}
  .flyer .ft small{font-size:clamp(13.8px,calc(12.82px + 0.252vw),15.6px);color:var(--gray);font-weight:600;}
  .flyer .fa{flex:none;width:22px;height:22px;stroke:var(--gray);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .apply .fee{font-size:clamp(15.9px,calc(14.79px + 0.291vw),18px);font-weight:700;color:var(--ink);background:var(--soft);border-radius:12px;padding:11px 14px;line-height:1.55;word-break:keep-all;}

  .seg{display:flex;gap:8px;margin-bottom:18px;}
  .seg button{flex:1;border:1.5px solid var(--line);background:var(--white);color:var(--gray);font-size:clamp(18px,calc(16.76px + 0.33vw),20.4px);font-weight:800;padding:14px 6px;border-radius:14px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow);}
  @media(max-width:480px){.seg{gap:6px}.seg button{font-size:15.5px;padding:12px 3px;word-break:keep-all;}}
  .seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(243,129,0,.24);}
  .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tab{flex:1;border:1.5px solid var(--line);background:var(--white);color:var(--gray);font-size:clamp(17px,calc(15.78px + 0.31vw),19.2px);font-weight:800;padding:11px 6px;border-radius:14px;cursor:pointer;font-family:inherit;text-align:center;transition:.12s;}
  .tab.on{background:var(--brand);border-color:var(--brand);color:#fff;}
  .tab .c{font-size:clamp(13.8px,calc(12.82px + 0.252vw),15.6px);opacity:.85;margin-left:3px;}

  .filters{display:flex;gap:8px;margin-bottom:16px;}
  .filters select{flex:1;min-width:0;height:48px;border:1.5px solid var(--line);background:var(--white);color:var(--ink);font-size:clamp(15.9px,calc(14.79px + 0.291vw),18px);font-weight:700;font-family:inherit;border-radius:12px;padding:0 30px 0 13px;box-shadow:var(--shadow);cursor:pointer;-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B655F' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 9px center;background-size:16px;}
  .filters select.act{border-color:var(--brand);color:var(--action);}

  .plist{display:flex;flex-direction:column;gap:11px;}
  .pcard{display:flex;align-items:center;gap:14px;background:var(--white);border-radius:16px;box-shadow:var(--shadow);padding:15px 16px;cursor:pointer;transition:.12s;}
  .pcard:hover{transform:translateY(-1px);}
  .pthumb{flex:none;width:60px;height:60px;border-radius:14px;background:linear-gradient(135deg,#F7B26A,#F38100);display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;}
  .pthumb svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.8;}
  .pinfo{flex:1;min-width:0;}
  .pinfo .nm{font-size:clamp(19.1px,calc(17.75px + 0.349vw),21.6px);font-weight:800;letter-spacing:-.3px;}
  .pinfo .meta{font-size:clamp(15.4px,calc(14.3px + 0.281vw),17.4px);color:var(--gray);margin-top:3px;}
  .pfee{flex:none;font-size:clamp(14.8px,calc(13.8px + 0.272vw),16.8px);font-weight:800;color:var(--accent);background:var(--accent-soft);padding:5px 11px;border-radius:12px;}
  .pfee.paid{color:var(--action);background:var(--soft);}
  .empty{text-align:center;color:var(--gray);font-size:clamp(17px,calc(15.78px + 0.31vw),19.2px);padding:36px 0;}
  .pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px;}
  .pager button{min-width:104px;height:54px;border:1.5px solid var(--line);background:var(--white);color:var(--action);font-size:clamp(19.1px,calc(17.75px + 0.349vw),21.6px);font-weight:800;border-radius:14px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:7px;}
  .pager button:disabled{opacity:.32;cursor:default;box-shadow:none;}
  .pager button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
  .pager .pg{font-size:clamp(18px,calc(16.76px + 0.33vw),20.4px);font-weight:800;color:var(--gray);min-width:58px;text-align:center;}

  /* ===== 상세 ===== */
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .back{width:44px;height:44px;border-radius:14px;background:var(--white);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .back svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .top .t{font-size:clamp(21.2px,calc(19.72px + 0.388vw),24px);font-weight:800;}
  .hero{position:relative;height:200px;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px;background:linear-gradient(135deg,#F7B26A,#F38100);background-size:cover;background-position:center;display:flex;align-items:flex-end;}
  .hero .cap{position:relative;width:100%;padding:18px;background:linear-gradient(transparent,rgba(50,30,8,.62));}
  .b{display:inline-block;font-size:clamp(13.8px,calc(12.82px + 0.252vw),15.6px);font-weight:800;padding:5px 13px;border-radius:20px;}
  .b.cat{background:var(--action);color:#fff;}
  .b.sub{background:rgba(255,255,255,.92);color:var(--action);margin-left:6px;}
  .hero .nm{font-size:clamp(28.6px,calc(26.62px + 0.524vw),32.4px);font-weight:800;color:#fff;margin-top:9px;letter-spacing:-.6px;}
  .card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);padding:6px 20px;margin-bottom:14px;}
  .row{display:flex;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row .k{width:76px;font-size:clamp(17px,calc(15.78px + 0.31vw),19.2px);color:var(--gray);font-weight:600;}
  .row .v{flex:1;font-size:clamp(19.1px,calc(17.75px + 0.349vw),21.6px);font-weight:800;}
  .warn{background:var(--soft);border:1px solid #F3D6B0;border-radius:16px;padding:15px 18px;display:flex;gap:12px;margin-bottom:20px;}
  .warn svg{flex:none;width:24px;height:24px;stroke:var(--brand);fill:none;stroke-width:2.2;margin-top:1px;}
  .warn b{font-size:clamp(18px,calc(16.76px + 0.33vw),20.4px);font-weight:800;line-height:1.5;}
  .sec{font-size:clamp(22.3px,calc(20.71px + 0.407vw),25.2px);font-weight:800;margin:4px 2px 12px;display:flex;align-items:center;gap:9px;}
  .sec::before{content:"";width:5px;height:20px;border-radius:3px;background:var(--accent);}
  .step{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);}
  .step:last-child{border-bottom:none;}
  .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:clamp(15.9px,calc(14.79px + 0.291vw),18px);font-weight:800;display:flex;align-items:center;justify-content:center;}
  .step b{font-size:clamp(18px,calc(16.76px + 0.33vw),20.4px);font-weight:800;}
  .step p{font-size:clamp(15.9px,calc(14.79px + 0.291vw),18px);color:var(--gray);margin-top:3px;white-space:pre-line;line-height:1.5;}
  .callnote{text-align:center;color:var(--gray);font-size:clamp(17px,calc(15.78px + 0.31vw),19.2px);line-height:1.6;margin:20px 0 12px;}
  .call{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--brand);color:#fff;font-size:clamp(23.3px,calc(21.69px + 0.427vw),26.4px);font-weight:800;height:60px;border-radius:16px;box-shadow:0 8px 22px rgba(243,129,0,.28);}
  .call svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;}
</style>
</head>
<body>
<div class="wrap">
  <!-- 목록 -->
  <div id="listView">
    <div class="seg" id="seg"></div>
    <div id="viewApply" class="hidden"><div class="apply" id="applyBox"></div></div>
    <div id="viewMore" class="hidden"><div class="apply" id="moreBox"></div></div>
    <a class="flyer" id="flyer" href="https://www.bwsenior.or.kr/main/sub.html?pageCode=4" target="_top"><span class="fi"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg></span><span class="ft"><b>프로그램 안내 홍보지 보기</b><small>학기별 수강생 모집 홍보지를 크게 볼 수 있어요</small></span><svg class="fa" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></a>
    <div id="viewList">
      <div class="tabs" id="tabs"></div>
      <div class="filters" id="filters"></div>
      <div class="plist" id="plist"></div>
      <div class="pager" id="pager"></div>
    </div>
  </div>
  <!-- 상세 -->
  <div id="detailView" class="hidden"></div>
</div>

<script>
(function(){
  var DATA=null, curCat=null, curPage=1, PAGE=10, fDay='', fPlace='', fFee='', ICON='<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>';
  var CATS=['평생교육','동아리','특강'];
  var topView=(/[?&]view=(list|apply|more)/.exec(location.search)||[])[1]||'apply';   // 첫 화면: 수강신청 안내   // 'list'(프로그램 시간표) | 'apply'(수강신청 안내)

  function renderSeg(){
    var seg=document.getElementById('seg');
    seg.innerHTML='<button data-v="apply"'+(topView==='apply'?' class="on"':'')+'>수강신청 안내</button>'
      + '<button data-v="list"'+(topView==='list'?' class="on"':'')+'>프로그램 시간표</button>'
      + '<button data-v="more"'+(topView==='more'?' class="on"':'')+'>문의사항</button>';
    seg.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click',function(){ topView=b.dataset.v; applyTopView(); });
    });
  }
  function applyTopView(){
    document.getElementById('viewApply').classList.toggle('hidden', topView!=='apply');
    document.getElementById('viewList').classList.toggle('hidden', topView!=='list');
    document.getElementById('viewMore').classList.toggle('hidden', topView!=='more');
    renderSeg();
    window.scrollTo(0,0); sendHeight();
  }

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function telLink(t){t=esc(t);return t?'<a href="tel:'+t.replace(/[^0-9]/g,'')+'">'+t+'</a>':'-';}
  function days(arr){return (arr&&arr.length)?arr.join('·')+'요일':'';}
  function timeRange(p){return (p.시작시간||'')+(p.종료시간?' – '+p.종료시간:'');}
  function periodRange(p){return fmtDate(p.운영시작)+(p.운영종료?' – '+fmtDate(p.운영종료):'');}
  function fmtDate(d){if(!d)return '';var m=String(d).match(/(\d{4})-(\d{2})-(\d{2})/);return m?(+m[2])+'월 '+(+m[3])+'일':d;}

  var WD=['일','월','화','수','목','금','토'];
  function fmtDateW(d){var m=String(d||'').match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return d||'';var w=new Date(+m[1],+m[2]-1,+m[3]).getDay();return (+m[2])+'월 '+(+m[3])+'일('+WD[w]+')';}
  function range(a,b){return a||b?(fmtDateW(a)+(b?' ~ '+fmtDateW(b):'')):'';}
  function renderApply(){
    var a=DATA.신청안내||{}, box=document.getElementById('applyBox');
    var open = a.현재상태 && a.현재상태.indexOf('아님')<0;
    var html='<span class="st '+(open?'open':'closed')+'" data-k="현재상태">'+(open?'지금 신청할 수 있어요':'지금은 신청 기간이 아닙니다')+'</span>';
    html+='<h2 data-k="학기명">'+(a.학기명?esc(a.학기명)+' ':'')+'수강 신청 안내</h2><div class="grid">';
    // [라벨, 값, 이 줄을 만드는 엑셀 항목들]
    var items=[
      ['신청 기간',range(a.신청시작일,a.신청종료일),'신청시작일 신청종료일'],
      ['신청 대상',a.신청대상||'복지관 등록 회원','신청대상'],
      ['신청 방법',a.신청방법||'방문 후 키오스크 신청','신청방법'],
      ['신청 개수',a.신청개수||'1인 최대 3과목','신청개수'],
      ['선정 방법',a.선정방법||'정원 초과 시 추첨','선정방법'],
      ['선정 발표',[fmtDateW(a.선정발표),a.선정발표_시각].filter(Boolean).join(' ')+(a.선정발표_방법?' · '+a.선정발표_방법:''),'선정발표 선정발표_시각 선정발표_방법'],
      ['수강료 납부',range(a.수강료납부_시작,a.수강료납부_종료),'수강료납부_시작 수강료납부_종료'],
      ['교육 기간',range(a.교육기간_시작,a.교육기간_종료),'교육기간_시작 교육기간_종료']
    ];
    items.forEach(function(it){ if(it[1]) html+='<div class="it" data-k="'+it[2]+'"><span class="lbl">'+esc(it[0])+'</span><span class="val">'+esc(it[1])+'</span></div>'; });
    var tel=a.문의전화||DATA.문의전화;
    if(tel) html+='<div class="it" data-k="문의전화"><span class="lbl">문의</span><span class="val">'+telLink(tel)+'</span></div>';
    html+='</div>';
    if(!open && a.신청기간아닐때_문구) html+='<div class="note" data-k="신청기간아닐때_문구">'+esc(a.신청기간아닐때_문구)+'</div>';

    // 이용 절차 (고정)
    var proc=['복지관 회원 가입','수강 신청(방문)','선정 여부 확인','프로그램 참여'];
    html+='<div class="subh">이용 절차</div><div class="proc">'
      + proc.map(function(s,i){ return (i?'<span class="ar">›</span>':'')+'<span class="p">'+esc(s)+'</span>'; }).join('')
      + '</div>';

    // 수강료 (고정)
    html+='<div class="subh">수강료</div><div class="fee">수강료 무료(일부 유료) · 교재비·재료비는 별도(본인 부담)</div>';

    // 유의사항 (기관 고정 규칙)
    var rules=[
      '수강 신청 시 회원증을 반드시 지참하세요.',
      '1인당 최대 3과목까지 신청할 수 있습니다.',
      '신청자가 정원을 넘으면 추첨으로 선정하며, 미선정자는 대기번호가 부여되어 잔여석 발생 시 순번대로 안내합니다.',
      '정원이 미달된 프로그램은 과목 수 제한 없이 추가 신청할 수 있습니다.',
      '3회 이상 무단결석 시 유선 연락 후 수강이 취소됩니다(연락이 되지 않아도 동일 적용).',
      '수강 신청 인원이 정원의 60% 미만이면 부득이하게 폐강될 수 있습니다.',
      '법정공휴일에는 프로그램이 휴강됩니다.'
    ];
    html+='<div class="subh">유의사항</div><ul class="rules">'
      + rules.map(function(r){ return '<li>'+esc(r)+'</li>'; }).join('')
      + '</ul>';

    box.innerHTML=html;

    // 자세한 안내 (엑셀 '안내문' 시트) — 별도 화면, 한 번에 하나만 펼침
    var notes=DATA.안내문||[], mb=document.getElementById('moreBox');
    mb.innerHTML=notes.length?'<div class="more">'
        + notes.map(function(n,i){ return '<details data-n="'+i+'"><summary>'+esc(n.제목)+'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></summary><div class="mb">'+esc(n.내용)+'</div></details>'; }).join('')
        + '</div>':'<div class="empty">등록된 안내가 없습니다.</div>';
    var ds=mb.querySelectorAll('details');
    ds.forEach(function(d){ d.addEventListener('toggle',function(){ if(d.open) ds.forEach(function(o){ if(o!==d) o.open=false; }); sendHeight(); }); });
  }

  function renderTabs(){
    document.getElementById('tabs').innerHTML=CATS.map(function(c){
      var n=DATA.프로그램.filter(function(p){return p.구분===c;}).length;
      return '<button class="tab'+(c===curCat?' on':'')+'" data-c="'+c+'">'+c+'<span class="c">'+n+'</span></button>';
    }).join('');
  }

  var DAYS=['월','화','수','목','금','토','일'];
  function renderFilters(){
    var inCat=DATA.프로그램.filter(function(p){return p.구분===curCat;});
    // 현재 카테고리에 실제 있는 요일·장소만 옵션으로
    var dset={}, pset={};
    inCat.forEach(function(p){ (p.요일||[]).forEach(function(d){dset[d]=1;}); if(p.장소)pset[p.장소]=1; });
    var dayOpts=DAYS.filter(function(d){return dset[d];}).map(function(d){return {v:d,label:d+'요일'};});
    var placeOpts=Object.keys(pset).sort().map(function(p){return {v:p,label:p};});
    var feeOpts=[{v:'무료',label:'무료'},{v:'유료',label:'유료'}];
    function sel(id,cur,all,opts){
      var h='<select id="'+id+'" class="'+(cur?'act':'')+'"><option value="">'+all+'</option>';
      opts.forEach(function(o){ h+='<option value="'+esc(o.v)+'"'+(o.v===cur?' selected':'')+'>'+esc(o.label)+'</option>'; });
      return h+'</select>';
    }
    var f=document.getElementById('filters');
    f.innerHTML=sel('fDay',fDay,'전체 요일',dayOpts)
      + sel('fPlace',fPlace,'전체 장소',placeOpts)
      + sel('fFee',fFee,'무료·유료',feeOpts);
    f.querySelector('#fDay').onchange=function(){fDay=this.value;curPage=1;renderFilters();renderList();};
    f.querySelector('#fPlace').onchange=function(){fPlace=this.value;curPage=1;renderFilters();renderList();};
    f.querySelector('#fFee').onchange=function(){fFee=this.value;curPage=1;renderFilters();renderList();};
  }

  function renderList(){
    var items=DATA.프로그램.filter(function(p){return p.구분===curCat;});
    // 필터 적용
    if(fDay)   items=items.filter(function(p){return (p.요일||[]).indexOf(fDay)>=0;});
    if(fPlace) items=items.filter(function(p){return p.장소===fPlace;});
    if(fFee)   items=items.filter(function(p){var paid=(p.수강료||0)>0; return fFee==='유료'?paid:!paid;});
    // 요일 → 시작시간 순 정렬
    var order={'월':1,'화':2,'수':3,'목':4,'금':5,'토':6,'일':7};
    items.sort(function(a,b){
      var da=(a.요일&&a.요일[0]?order[a.요일[0]]:9)-(b.요일&&b.요일[0]?order[b.요일[0]]:9);
      if(da) return da; return (a.시작시간||'').localeCompare(b.시작시간||'');
    });
    var el=document.getElementById('plist'), pg=document.getElementById('pager');
    if(!items.length){ el.innerHTML='<div class="empty">'+((fDay||fPlace||fFee)?'조건에 맞는 프로그램이 없습니다.':'등록된 프로그램이 없습니다.')+'</div>'; pg.innerHTML=''; sendHeight(); return; }
    var totalPages=Math.ceil(items.length/PAGE);
    if(curPage>totalPages) curPage=totalPages;
    var pageItems=items.slice((curPage-1)*PAGE, curPage*PAGE);
    el.innerHTML=pageItems.map(function(p){
      var paid=(p.수강료||0)>0;
      var thumb=p.사진?' style="background-image:url('+esc(p.사진)+')"':'';
      return '<div class="pcard" data-id="'+esc(p.id)+'">'
        + '<div class="pthumb"'+thumb+'>'+(p.사진?'':ICON)+'</div>'
        + '<div class="pinfo"><div class="nm">'+esc(p.이름)+'</div>'
        +   '<div class="meta">'+esc(days(p.요일))+' '+esc(timeRange(p))+' · '+esc(p.장소||'')+'</div></div>'
        + '<div class="pfee'+(paid?' paid':'')+'">'+esc(p.수강료표시||'무료')+'</div>'
        + '</div>';
    }).join('');
    el.querySelectorAll('.pcard').forEach(function(c){ c.addEventListener('click',function(){ openP(c.dataset.id); }); });
    // 페이지 넘김 버튼 (2쪽 이상일 때만)
    if(totalPages>1){
      pg.innerHTML='<button id="pgPrev"'+(curPage<=1?' disabled':'')+'><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>이전</button>'
        + '<span class="pg">'+curPage+' / '+totalPages+'</span>'
        + '<button id="pgNext"'+(curPage>=totalPages?' disabled':'')+'>다음<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>';
      var pv=document.getElementById('pgPrev'), nx=document.getElementById('pgNext');
      if(pv) pv.addEventListener('click',function(){ if(curPage>1){curPage--; renderList(); window.scrollTo(0,0);} });
      if(nx) nx.addEventListener('click',function(){ if(curPage<totalPages){curPage++; renderList(); window.scrollTo(0,0);} });
    } else { pg.innerHTML=''; }
    sendHeight();
  }

  function renderDetail(id){
    var p=DATA.프로그램.filter(function(x){return x.id===id;})[0];
    if(!p){ location.hash=''; return; }
    var a=DATA.신청안내||{};
    var paid=(p.수강료||0)>0;
    var hero=p.사진?' style="background-image:url('+esc(p.사진)+')"':'';
    var h='';
    h+='<div class="top"><div class="back" id="pBack"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div><div class="t">프로그램 안내</div></div>';
    h+='<div class="hero"'+hero+'><div class="cap"><span class="b cat">'+esc(p.구분)+'</span>'
      + (p.분류?'<span class="b sub">'+esc(p.분류)+'</span>':'')
      + '<div class="nm">'+esc(p.이름)+'</div></div></div>';
    h+='<div class="card">'
      + row('언제', esc(days(p.요일))+' '+esc(timeRange(p)))
      + row('기간', esc(periodRange(p)))
      + row('어디서', esc(p.장소))
      + row('강사', esc(p.강사))
      + row('정원', p.정원?esc(p.정원)+'명':'-')
      + row('수강료', esc(p.수강료표시||'무료')+(p.재료비별도?' <span style="font-size:clamp(14.8px,calc(13.8px + 0.272vw),16.8px);color:var(--gray);font-weight:600">(재료비 별도)</span>':''))
      + '</div>';
    if(p.안내문구) h+='<div class="warn"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L2 18a2 2 0 001.7 3h16.6a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg><b>'+esc(p.안내문구)+'</b></div>';
    // 신청 스텝
    h+='<div class="sec">신청은 이렇게 하세요</div><div class="card">'
      + step(1,'신청 기간에 신청하세요', esc(a.신청방법||'복지관 방문 신청'))
      + step(2,'많으면 추첨합니다', esc(a.선정방법||'정원을 넘으면 무작위 추첨'))
      + step(3,'결과를 알려드립니다', esc(a.선정발표_방법||'개별 문자 안내'))
      + '</div>';
    var tel=a.문의전화||DATA.문의전화;
    h+='<div class="callnote">이 프로그램이 궁금하시면<br>전화로 물어보세요.</div>';
    h+='<a class="call" href="tel:'+esc(tel).replace(/[^0-9]/g,'')+'"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012 4.2 2 2 0 014 2h3a2 2 0 012 1.7c.1.9.3 1.8.6 2.6a2 2 0 01-.5 2.1L8 9.6a16 16 0 006 6l1.2-1.1a2 2 0 012.1-.5c.8.3 1.7.5 2.6.6A2 2 0 0122 16.9z"/></svg>'+esc(tel)+'</a>';
    document.getElementById('detailView').innerHTML=h;
    document.getElementById('pBack').onclick=function(){ if(INLINE){ showList(); } else history.back(); };
    sendHeight();
  }
  function row(k,v){return '<div class="row"><div class="k">'+k+'</div><div class="v">'+(v||'-')+'</div></div>';}
  function step(n,t,p){return '<div class="step"><div class="num">'+n+'</div><div><b>'+t+'</b><p>'+p+'</p></div></div>';}

  var INLINE=location.protocol==='about:';   // 편집기 미리보기 안에서는 주소(#) 이동이 안 돼서 직접 화면 전환
  if(INLINE){ var fl=document.getElementById('flyer'); if(fl) fl.target='_blank'; }   // 편집기 미리보기에서는 새 창
  function openP(id){ if(INLINE){ showDetail(id); } else location.hash='p/'+id; }
  function showDetail(id){ document.getElementById('listView').classList.add('hidden'); document.getElementById('detailView').classList.remove('hidden'); renderDetail(id); window.scrollTo(0,0); }
  function showList(){ document.getElementById('detailView').classList.add('hidden'); document.getElementById('listView').classList.remove('hidden'); sendHeight(); }
  function route(){
    var h=location.hash.replace(/^#/,'');
    var lv=document.getElementById('listView'), dv=document.getElementById('detailView');
    if(h.indexOf('p/')===0){
      lv.classList.add('hidden'); dv.classList.remove('hidden');
      renderDetail(h.slice(2)); window.scrollTo(0,0);
    } else {
      dv.classList.add('hidden'); lv.classList.remove('hidden');
      sendHeight();
    }
  }
  window.addEventListener('hashchange',route);

  // 편집기 규약: render(데이터) + BW_LOAD 마커 + window.__bwHi(미리보기 강조)
  function render(j){
    DATA=j; DATA.프로그램=DATA.프로그램||[]; if(!curCat) curCat=CATS[0];
    renderSeg(); applyTopView();
    renderApply(); renderTabs(); renderFilters(); renderList(); route();
  }
  document.getElementById('tabs').addEventListener('click',function(e){
    var b=e.target.closest('.tab'); if(!b)return; curCat=b.dataset.c;
    curPage=1; fDay=''; fPlace=''; fFee='';   // 탭 바꾸면 필터 초기화
    renderTabs(); renderFilters(); renderList();
  });
  window.__bwHi=function(m){
    if(!DATA) return true;
    var lv=document.getElementById('listView'), dv=document.getElementById('detailView');
    function mark(el){ if(el){ el.classList.add('bwhi'); el.scrollIntoView({block:'center'}); } }
    if(m.key&&/^[gn]:/.test(m.key)){
      dv.classList.add('hidden'); lv.classList.remove('hidden'); topView=m.key[0]==='g'?'apply':'more'; applyTopView();
      var k=m.key.slice(2), el=m.key[0]==='g'?document.querySelector('#applyBox [data-k~="'+k+'"]'):document.querySelector('#moreBox details[data-n="'+k+'"]');
      if(el&&el.tagName==='DETAILS') el.open=true;
      mark(el||document.getElementById(m.key[0]==='g'?'applyBox':'moreBox')); sendHeight(); return true;
    }
    if(m.key){
      if(DATA.프로그램.some(function(x){return x.id===m.key;})){
        lv.classList.add('hidden'); dv.classList.remove('hidden'); renderDetail(m.key); mark(dv.querySelector('.hero')); return true;
      }
    }
    dv.classList.add('hidden'); lv.classList.remove('hidden');
    if(m.tab!=null && m.tab>=0 && CATS[m.tab]){
      topView='list'; applyTopView(); curCat=CATS[m.tab]; curPage=1; fDay=''; fPlace=''; fFee='';
      renderTabs(); renderFilters(); renderList(); return true;
    }
    if(m.sel){ topView='apply'; applyTopView(); mark(document.querySelector(m.sel)); return true; }
    return false;
  };

  /*BW_LOAD*/fetch('data/programs.json?t='+Date.now()).then(function(r){return r.json();}).then(render)
  .catch(function(){ document.getElementById('plist').innerHTML='<div class="empty">프로그램 정보를 불러오지 못했습니다.</div>'; });/*BW_LOAD_END*/

  function sendHeight(){ try{var h=Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height)+10; parent.postMessage({bwPrograms:'height',height:h},'*'); }catch(e){} }
  window.addEventListener('load',sendHeight); window.addEventListener('resize',sendHeight);
  setTimeout(sendHeight,700); setTimeout(sendHeight,1600);
})();
</script>
</body>
</html>
